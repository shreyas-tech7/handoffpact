[project]
name = "handoffpact"
version = "0.1.0rc1"
description = "Contract checks for the messages agents pass to each other, plus a blast-radius benchmark."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Shreyas" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
handoffpact = "handoffpact.cli:main"

[project.entry-points.pytest11]
handoffpact = "handoffpact.pytest_plugin"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handoffpact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p pytester"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
