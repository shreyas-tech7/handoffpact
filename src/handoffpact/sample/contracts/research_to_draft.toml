[edge]
name = "research_to_draft"
producer = "research"
consumer = "draft"
description = "Research looks up the order and the policies that fit the intent, and passes the facts to the drafter."
extra = "forbid"

[fields.ticket_id]
type = "str"
ref = "handoff.ticket_id"

[fields.turn]
type = "int"
ref = "turn"

[fields.intent]
type = "str"
enum = ["refund", "shipping", "warranty", "account"]
ref = "handoff.intent"

[fields.order_id]
type = "str"
ref = "handoff.order_id"

[fields.order_total]
type = "float"

[fields.days_since_order]
type = "int"

[fields.policy_ids]
type = "list[str]"
min_items = 1
max_items = 3
ref = "corpus[*].id"

[fields.excerpts]
type = "list[str]"
min_items = 1
max_items = 3
min_length = 30
max_length = 400

[semantic]
checks = ["order_facts_match", "policies_fit_intent", "excerpts_are_sentences", "no_instruction_text"]
