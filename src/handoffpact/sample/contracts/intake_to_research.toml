[edge]
name = "intake_to_research"
producer = "intake"
consumer = "research"
description = "Intake reads the customer ticket and tells research what the customer wants and which order it is about."
extra = "forbid"

[fields.ticket_id]
type = "str"
ref = "ticket_id"

[fields.customer_id]
type = "str"
ref = "customer_id"

[fields.turn]
type = "int"
ref = "turn"

[fields.intent]
type = "str"
enum = ["refund", "shipping", "warranty", "account"]

[fields.order_id]
type = "str"
ref = "orders[*].order_id"

[fields.question]
type = "str"
min_length = 15
max_length = 400

[semantic]
checks = ["order_id_in_ticket", "question_from_ticket", "no_instruction_text"]
